<title>AI作業の全体像</title>
<style>
/* 見た目の方針(2026-09-17): 深い夜空の地に、ガラスのカード。色相は「誰が」(顧客=四角・モデル=丸)、光は「状態」。
   暗い世界に振り切る(端末と同じ地)。文字色はコントラストを計算して選ぶ(fgFor)。 */
:root{
  --bg:#070A12;--bg2:#0B0F1A;--panel:rgba(12,16,26,.94);--ink:#E6EAF2;--muted:#8B94A7;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --frame:rgba(255,255,255,.025);--frame-line:rgba(255,255,255,.07);
  --card:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));--card-past:rgba(255,255,255,.015);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.8);--accent:#7DD3FC;--red:#FF5C6C;--green:#3DF2A6;--yellow:#FFD166;
  --edge:rgba(150,170,210,.45);--edge-hi:#7DD3FC;--glow:0 0 0 1px rgba(125,211,252,.45),0 0 28px -6px rgba(125,211,252,.7);
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
/* 見た目2「figma」: 光を消し、灰の地に 1px の線。選択は青 2px。切替は右上の「見た目」 */
:root[data-look="figma"]{
  --bg:#1E1E1E;--bg2:#252525;--panel:#2C2C2C;--ink:#E6E6E6;--muted:#A0A0A0;--line:#3A3A3A;--line2:#4A4A4A;
  --frame:#232323;--frame-line:#3A3A3A;--card:#2C2C2C;--card-past:#262626;--shadow:0 1px 2px rgba(0,0,0,.35);
  --accent:#0D99FF;--red:#F24822;--green:#14AE5C;--yellow:#FFCD29;--edge:#6B6B6B;--edge-hi:#0D99FF;--glow:0 0 0 2px #0D99FF;
}
:root[data-look="figma"] body::before{background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.09) 1px,transparent 1.4px) 0 0/16px 16px}
:root[data-look="figma"] .card{border-radius:6px;box-shadow:var(--shadow) !important;background:var(--card);padding-left:10px}
:root[data-look="figma"] .card::before{box-shadow:none;width:2px;left:0;top:0;bottom:0;border-radius:0}
:root[data-look="figma"] .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) !important;transform:none}
:root[data-look="figma"] .card.turn{animation:none;box-shadow:0 0 0 2px var(--red) !important}
:root[data-look="figma"] .card .dot.work{animation:none;box-shadow:none}
:root[data-look="figma"] .frame{border-radius:6px}
:root[data-look="figma"] .frame::before,:root[data-look="figma"] .frame::after{display:none}
:root[data-look="figma"] .frame .flabel b{box-shadow:none;border-radius:4px}
:root[data-look="figma"] #toolbar .chip{border-radius:6px;background:transparent}
:root[data-look="figma"] #toolbar .chip.on{background:rgba(13,153,255,.18);box-shadow:none}
:root[data-look="figma"] #toolbar .chip.red.on{background:rgba(242,72,34,.18);box-shadow:none}
:root[data-look="figma"] #edges path.hi{filter:none}
:root[data-look="figma"] #panel button.primary{background:var(--accent);color:#fff;box-shadow:none}
:root[data-look="figma"] .sendrow input{border-color:var(--line2);box-shadow:none}
:root[data-look="figma"] .sendrow input:focus{border-color:var(--accent);box-shadow:none}
:root[data-look="figma"] pre.screen{box-shadow:none;background:#111}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 1.5px) 0 0/28px 28px;}
/* ぼかし(backdrop-filter)と大きな放射光は、パン中のフレーム時間を 8→18ms にした(2026-09-17 実測)ので使わない */
#stage,#toolbar,#panel,#status{position:relative;z-index:1}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-direction:column;gap:6px;padding:8px 12px;}
#toolbar .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#toolbar [hidden]{display:none !important}
#toolbar .row.more{padding-top:6px;border-top:1px solid var(--line)}
#toolbar .row[hidden]{display:none}
#toolbar .seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
#toolbar .seg .chip{border:0;border-radius:0;padding:4px 12px}
#toolbar .seg .chip+.chip{border-left:1px solid var(--line2)}
#toolbar{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(0,0,0,.9)}
:root[data-app] #toolbar{padding-left:84px}
#toolbar .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;font-size:12px;white-space:nowrap;transition:background .12s,box-shadow .12s}
#toolbar .chip:hover{background:rgba(255,255,255,.07)}
#toolbar .chip.on{background:rgba(125,211,252,.16);color:var(--accent);border-color:rgba(125,211,252,.5);box-shadow:0 0 16px -6px var(--accent)}
#toolbar .chip.red{border-color:var(--red);color:var(--red);font-weight:700}
#toolbar .chip.red.on{background:rgba(255,92,108,.16);box-shadow:0 0 16px -6px var(--red)}
#toolbar .sep{width:1px;height:20px;background:var(--line)}
#toolbar input,#toolbar select{font:inherit;padding:3px 8px;border:1px solid var(--line2);border-radius:8px;background:rgba(0,0,0,.35);color:var(--ink)}
#toolbar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(125,211,252,.18)}
#toolbar #q{width:220px}
.membar{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.membar .bar{width:90px;height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.membar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7DD3FC);box-shadow:0 0 10px var(--green)}
.warn{color:var(--red);font-weight:700}
.ok{color:var(--green)}
/* 「いま」のレール: 生きているセッションだけを、判断待ち→返答済み→作業中の順に 1 列。盤を見る前にここだけで答えが出る */
#rail{position:fixed;left:0;right:0;z-index:19;display:flex;gap:8px;align-items:center;padding:8px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail:empty{display:none}
#rail .rl{flex:none;display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:8px;border:1px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;max-width:320px;font-size:12px;color:var(--ink);transition:background .12s}
#rail .rl:hover{background:rgba(255,255,255,.08)}
#rail .rl.turn{border-color:var(--red);background:rgba(255,92,108,.12)}
#rail .rl.wait{border-color:rgba(255,209,102,.5)}
#rail .rl.sel{box-shadow:var(--glow)}
#rail .rl .sq{width:10px;height:10px;border-radius:2px;flex:none}
#rail .rl .dt{width:10px;height:10px;border-radius:50%;flex:none}
#rail .rl .lbl{font-weight:700;white-space:nowrap}
#rail .rl .lbl.turn{color:var(--red)} #rail .rl .lbl.wait{color:var(--yellow)} #rail .rl .lbl.work{color:var(--green)}
#rail .rl .dg{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#rail .rlhead{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-right:4px}
/* 空状態: 何も動いていない時は「次の一手」を 1 つだけ */
#empty{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:5;text-align:center;max-width:460px;padding:24px 28px;border:1px dashed var(--line2);border-radius:12px;background:rgba(7,10,18,.7);color:var(--ink2);font-size:14px;line-height:1.7}
#empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
#empty .kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:rgba(255,255,255,.04);color:var(--ink)}
/* 初回ガイド(コーチマーク): 対象を切り抜いて暗くし、吹き出しで 1 つずつ */
#tour{position:fixed;inset:0;z-index:60;display:none}
#tour.on{display:block}
#tour .hole{position:absolute;border-radius:10px;box-shadow:0 0 0 9999px rgba(3,5,10,.72),0 0 0 2px var(--accent),0 0 30px -4px var(--accent);pointer-events:none;transition:all .25s ease}
#tour .bub{position:absolute;max-width:380px;padding:16px 18px;border-radius:10px;background:#0F1420;border:1px solid var(--line2);box-shadow:0 20px 60px -20px rgba(0,0,0,.9);color:var(--ink);font-size:14px;line-height:1.6}
#tour .bub b{display:block;font-size:16px;margin-bottom:4px}
#tour .bub .st{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
#tour .bub .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#tour .bub button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer}
#tour .bub button.primary{background:rgba(125,211,252,.16);color:var(--accent);border-color:rgba(125,211,252,.5)}
#tour .bub .kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:rgba(255,255,255,.04)}
/* 会話ビュー: ターミナルの字面で、読みやすさは会話 */
.convwrap{display:flex;flex-direction:column;height:calc(100vh - 70px);gap:8px}
.convhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.convhead button{margin-left:auto}
.cvstate{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

.card .dot.turn{background:var(--red)}

#panel details{margin-top:10px}#panel summary{cursor:pointer;color:var(--muted);font-size:12px}

#world{--inv:1}
/* 引きの見出しは枠の「上」に1行で置く。枠の中に敷くとカードの下に潜って文字とカードが重なる(2026-09-17) */
.frame .fbig{display:none;position:absolute;left:0;right:0;bottom:100%;padding:0 4px calc(5px*var(--inv));font-size:min(calc(15px*var(--inv)),58px);line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.frame .fbig > *{display:inline !important;margin-right:.5em}
.frame .fbig .task{display:none !important}
.lod-mid .frame .flabel,.lod-mid .frame .fsum{font-size:calc(12px*var(--inv));top:calc(-22px*var(--inv))}
.frame .fbig b{font-size:1.25em}
.frame .fbig .dots i{display:inline-block;width:.85em;height:.85em;border-radius:50%;margin-right:.2em;vertical-align:middle}
.frame .fbig .task{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60em}
.lod-far .frame .fbig{display:block}
.lod-far .frame .flabel,.lod-far .frame .fsum{display:none}
.lod-far .card > *{visibility:hidden}
.lod-far .card{background:color-mix(in srgb,var(--mc) 55%,transparent);opacity:.9;border-color:transparent;box-shadow:0 0 18px -6px var(--mc)}
.lod-far .card.past{background:color-mix(in srgb,var(--mc) 22%,transparent);opacity:.7;box-shadow:none}
.lod-far .card::before{display:none}
.lod-far .card.past{opacity:.3}
.lod-far .card.turn{opacity:1;box-shadow:0 0 0 5px var(--red),0 0 40px var(--red)}
.lod-far .card .dot.work{visibility:visible;position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #fff}
.lod-mid .card .task,.lod-mid .card .foot,.lod-mid .card .ctag{display:none}
.lod-mid .card .mbadge{font-size:18px}
.lod-mid .card .doing,.lod-mid .card .st{font-size:16px}
.frame .fmore{pointer-events:auto;cursor:pointer;color:var(--accent);text-decoration:underline;margin-left:8px}
.card.bundle{border-style:dashed;background:var(--card-past)}
#status{position:fixed;left:10px;bottom:8px;z-index:20;font-size:11px;color:var(--muted);background:var(--panel);padding:4px 10px;border-radius:8px;border:1px solid var(--line);font-family:var(--mono)}

  #toolbar #q{width:140px}
}
/* ================= 洗練(2026-09-18): Figma/Linear の寸法。4px 格子・1px 線・色は状態だけ ================= */
:root{--f-bg:#1E1E1E;--f-surface:#2C2C2C;--f-raised:#333;--f-line:#383838;--f-line2:#444;--f-ink:#EDEDED;--f-ink2:#B3B3B3;--f-ink3:#8A8A8A;--f-blue:#0D99FF;--f-red:#F24822;--f-yellow:#FFC53D;--f-green:#14AE5C;--f-violet:#9747FF}
html,body{font:13px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-.003em}
/* 上のバー */
#toolbar{padding:8px 12px !important;background:rgba(30,30,30,.96) !important;border-bottom:1px solid var(--f-line) !important;box-shadow:none !important}
#toolbar .row.main{gap:8px;flex-wrap:nowrap}
#toolbar .seg{border:1px solid var(--f-line2) !important;border-radius:7px !important;background:#262626;padding:2px;gap:2px}
#toolbar .seg .chip{border:0 !important;border-radius:5px !important;padding:3px 12px !important;color:var(--f-ink2);font-weight:500;background:transparent !important;box-shadow:none !important}
#toolbar .seg .chip.on{background:#3A3A3A !important;color:var(--f-ink) !important}
#toolbar .seg .chip+.chip{border-left:0 !important}
#toolbar .search{flex:0 1 320px;min-width:120px}
#toolbar .search input{width:100% !important;height:28px;border-radius:7px !important;border:1px solid var(--f-line2) !important;background:#262626 !important;color:var(--f-ink);padding:0 10px !important}
#toolbar .search input:focus{border-color:var(--f-blue) !important;box-shadow:0 0 0 1px var(--f-blue) !important}
#toolbar .grow{flex:1}
#toolbar .stat{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--f-ink2);font:500 12.5px inherit;cursor:pointer;white-space:nowrap}
#toolbar .stat:hover{background:#2E2E2E}
#toolbar .stat i{width:7px;height:7px;border-radius:50%}
#toolbar .stat.turn i{background:var(--f-yellow);box-shadow:0 0 0 3px rgba(255,197,61,.18)}
#toolbar .stat.work i{background:var(--f-green)}
#toolbar .stat b{font-weight:600;color:var(--f-ink);font-variant-numeric:tabular-nums}
#toolbar .vsep{width:1px;height:18px;background:var(--f-line2);margin:0 2px}
#toolbar .ico{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--f-ink2);cursor:pointer}
#toolbar .ico:hover,#toolbar .ico.on{background:#2E2E2E;color:var(--f-ink)}
#toolbar .ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round}
#toolbar .ico b{position:absolute;top:1px;right:1px;min-width:14px;height:14px;border-radius:7px;background:var(--f-violet);color:#fff;font:600 9.5px/14px inherit;text-align:center;padding:0 3px}
#toolbar .ico b:empty{display:none}
#toolbar .row.more{border-top:1px solid var(--f-line) !important;padding-top:8px}
/* 枠 */
.frame{background:rgba(255,255,255,.015) !important;border:1px solid #2F2F2F !important;border-radius:10px !important}
.frame .flabel{top:-24px !important;font:600 12px inherit !important;color:var(--f-ink2) !important;letter-spacing:0}
.frame .flabel b{font-weight:600 !important;color:var(--f-ink) !important}
.frame .fsum{top:-23px !important;font-size:11.5px !important;color:var(--f-ink3) !important}
/* カード */
.card{background:var(--f-surface) !important;border:1px solid var(--f-line) !important;border-radius:8px !important;padding:10px 12px 9px !important;box-shadow:0 1px 2px rgba(0,0,0,.25) !important;display:flex;flex-direction:column;gap:5px;transition:border-color .08s,box-shadow .08s,transform .08s;opacity:1}
.card::before{display:none !important}
.card:hover{border-color:#555 !important;transform:none !important}
.card.sel{border-color:var(--f-blue) !important;box-shadow:0 0 0 1px var(--f-blue) !important}
.card.past{background:#262626 !important;opacity:.72}
.card.past:hover{opacity:1}
.card.dimmed{opacity:.28}
.card .c-top{display:flex;align-items:center;gap:8px;min-width:0;margin:0 !important;font-size:12px !important}
.card .c-state{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--f-ink2)}
.card .c-state i{width:7px;height:7px;border-radius:50%;background:var(--f-ink3)}
.card .c-when{color:var(--f-ink3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-tab{margin-left:auto;color:var(--f-ink3);font-size:11px}
.card .c-title{color:var(--f-ink);font-weight:500;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

function delegResult(g, live, past) {
  // 任せた後にその場所で始まった会話を、いちばん近いものから 1 つ選ぶ(±10 分以内)。無ければ「結果待ち」
  const cands = [...live, ...past].filter(n => {
    const s0 = n.s || n.r || {};
    const started = n.live ? (s0.started || n.t) : ((s0.start != null) ? s0.start : n.t);
    return (!g.cwd || s0.cwd === g.cwd) && started != null && started >= g.at - 60 && started <= g.at + 600;
  }).sort((a, b) => Math.abs(((a.s || a.r || {}).started || a.t) - g.at) - Math.abs(((b.s || b.r || {}).started || b.t) - g.at));
  const n = cands[0];
  if (!n) return {node: null, label: T('結果待ち')};
  const s0 = n.s || n.r || {};
  if (n.live) return {node: n, label: `${TS(s0.state || '')}${s0.doing ? ' · ' + String(s0.doing).slice(0, 30) : ''}`};
  return {node: n, label: `${T('終了')} · ${String(s0.last_prompt || s0.title || '').slice(0, 30)}`};
}
async function openDelegate(frameKey) {
  // 案件に仕事を任せる: 空いている AI を選び、共通の指示つきで新しい端末を起こして依頼文を渡す。
  // 長い依頼は「分けて同時に」も選べる(分解案は必ず人が見てから動かす)
  const f = (window._frames || []).find(x => x.key === frameKey); if (!f) return;
  const cwds = f.nodes.map(n => (n.s || n.r || {}).cwd).filter(Boolean);
  const cwd = cwds.sort((a, b) => cwds.filter(x => x === b).length - cwds.filter(x => x === a).length)[0] || '';
  let pick; try { pick = await getJSON('/api/pick'); } catch (e) { pick = {ai: '', why: String(e)}; }
  const label = (f.nodes.map(n => (n.s || n.r || {}).group_label).find(Boolean)) || frameKey.slice(2);
  if (!pick.ai) { say(`${T('いま任せられる AI がありません')}: ${pick.why}`, true); alert(`${T('いま任せられる AI がありません')}\n${pick.why}`); return; }
  const text = prompt(`${label} ${T('に任せる仕事')}（${pick.ai}${pick.profile ? ' / ' + pick.profile : ''}・${pick.why}）`, '');
  if (!text || !text.trim()) return;
  const one = {key: frameKey.slice(2), cwd, ai: pick.ai, profile: pick.profile || '', text: text.trim().slice(0, 4000)};
  if (confirm(T('この依頼を、並行できる小さな仕事に分けますか？（分けた案を見てから選べます。いいえ＝そのまま 1 本で任せる）'))) {
    const ok = await planAndRun(frameKey, one);
    if (ok) return;
  }
  await runDelegation(frameKey, one);
}

async function planAndRun(frameKey, base) {
  // 分解は AI に頼む(時間がかかる)。出た案はそのまま動かさず、選んでもらう
  say(T('分け方を考えています…'));
  let r; try { r = await getJSON('/api/plan', {method: 'POST', body: JSON.stringify({text: base.text})}); } catch (e) { r = {ok: false, reason: String(e)}; }
  if (!r.ok || !(r.tasks || []).length) { say(`${T('分けられませんでした')}: ${r.reason || ''}`, true); return false; }
  const lines = r.tasks.map((t, i) => `${i + 1}. ${t.title}`).join('\n');
  const ans = prompt(`${T('この分け方で同時に動かします。走らせる番号をカンマで（空欄＝全部・取り消しは Esc）')}\n\n${lines}`, r.tasks.map((t, i) => i + 1).join(','));
  if (ans === null) return true;   // 取り消し: 1 本での依頼もしない
  const want = ans.trim() ? ans.split(',').map(x => parseInt(x.trim(), 10)).filter(n => n >= 1 && n <= r.tasks.length) : r.tasks.map((t, i) => i + 1);
  if (!want.length) { say(T('走らせるものがありません'), true); return true; }
  const group = 'g' + Date.now();
  for (const n of want) {
    const t = r.tasks[n - 1];
    await runDelegation(frameKey, Object.assign({}, base, {text: t.prompt, title: t.title, group}));
    await new Promise(res => setTimeout(res, 400));   // 端末を一度に開きすぎない
  }
  say(`${want.length}${T('件を同時に走らせました')}`);
  return true;
}

function liveBySid() { const m = {}; (snap?.sessions || []).forEach(s => { if (s.sid) m[s.sid] = s; }); return m; }
function nodeList() {
  // 生きているセッション(snapshot) + 過去(index)。同じ sid は生きている方を採用。「いま」では過去を入れない
  const live = liveBySid();
  const nodes = [];
  const seen = new Set();
  (snap?.sessions || []).forEach(s => { if (s.mark === '⚪') return; nodes.push(liveNode(s)); seen.add(s.sid); });
  if (mode === 'history') (index.records || []).forEach(r => { if (seen.has(r.id)) return; if (r.live && live[r.id]) return; nodes.push(pastNode(r)); seen.add(r.id); });
  // 子(サブエージェント/査読/補助)は親と同じフレームに。親が無い査読・補助は「補助（元不明）」の束に
  const byId = {}; nodes.forEach(n => byId[n.id] = n);
  let orphans = 0;
  nodes.forEach(n => {
    if (!n.parentId) return;
    const p = byId[n.parentId];
    if (p) n.frameKey = p.frameKey;
    else if (n.role !== 'subagent') { n.parentId = 'bundle:helpers'; n.frameKey = 'home'; orphans++; }
    else n.parentId = null;
  });
  // 無人実行(claude -p / SDK)は日ごと・持ち場ごとに 1 枚へ畳む。実測 5,904 枚で 1 フレーム 35ms だったため
  if (filters.unatt) {
    const groups = {};
    nodes.forEach(n => {
      if (!n.unattended || n.bundle || isChild(n)) return;
      const d = new Date((n.t || 0) * 1000);
      const day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const key = `bundle:una:${n.frameKey}:${day}`;
      n.bundleId = key;
      const g = groups[key] = groups[key] || {n: 0, t: 0, frameKey: n.frameKey, day: day, ai: n.ai};
      g.n++; g.t = Math.max(g.t, n.t || 0);

function limitWhen(lim) {

    const hm = d.toLocaleTimeString(LANG === 'ja' ? 'ja-JP' : 'en-US', {hour: '2-digit', minute: '2-digit'});
    const day = new Date().toDateString() === d.toDateString() ? '' : d.toLocaleDateString(LANG === 'ja' ? 'ja-JP' : 'en-US', {month: 'numeric', day: 'numeric'}) + ' ';
    return `${day}${hm} ${T('に解除')}${left > 0 ? ` (${T('あと')}${fmtDur(left)})` : ''}`; }
  return lim.resets || T('解除時刻不明');
}

  if (tl && (tl.skills.length || tl.mcp.length)) rows.push(`<div class="tools">${tl.skills.map(([k, v]) => `<span class="tchip">skill · ${esc(k)} <i>${v}</i></span>`).join('')}${tl.mcp.map(([k, v]) => `<span class="tchip mcp">MCP · ${esc(k)} <i>${v}</i></span>`).join('')}</div>`);
  return rows.length ? `<div class="convloop">${rows.join('')}</div>` : '';
}
async function renderLive(n) {
  const s0 = n.s, m = s0.model_style || {};
  $('#pTitle').textContent = `${m.label || s0.ai} · ${s0.project || s0.tab}`; $('#pTitle').dataset.kind = 'live';
  $('#pBody').innerHTML = `
    <div class="convwrap">
      <div class="convhead"><span class="pill" style="background:${rgb(m.rgb)};color:${fgFor(m.rgb || [120,120,120])}">${esc(m.label || '')}</span>${s0.client ? `<span class="pill" style="background:${rgb(s0.client.rgb)};color:${fgFor(s0.client.rgb)}">${esc(s0.client.label)}</span>` : ''}<span id="cvState" class="cvstate"></span><button id="goBtn" class="primary" title="${T('カードをダブルクリックでも開く')}">${APP ? T('右の端末で開く') : T('iTerm で開く')}</button></div>
      ${loopLine(s0)}
      <div class="convlog" id="cvLog"><div class="cv empty">${T('読込中…')}</div></div>
      <div class="convlimit" id="cvLimit" hidden></div>
      <div class="convask" id="cvAsk" hidden></div>
      ${s0.sid && !String(s0.sid).startsWith('tty:') ? `<div class="convin"><span class="pr">❯</span><input id="sendIn" autocomplete="off" placeholder="${T('メッセージを送る（Enter）')}"></div><div id="sendMsg" class="legend"></div>` : `<div class="legend">${T('AI セッションではないので、ここからは送れません（端末で操作します）')}</div>`}
    </div>`;
  $('#goBtn').onclick = () => openInApp(s0);

  let etag = '', stickBottom = true;
  const log = $('#cvLog');
  log.addEventListener('scroll', () => { stickBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 12; });
  const pull = async () => {
    let d; try { d = await getJSON('/api/conv?tab=' + encodeURIComponent(s0.tab) + '&etag=' + encodeURIComponent(etag)); } catch (e) { return; }
    if (!d.ok || !$('#cvLog')) return;
    // 状態と判断待ちのボタン
    const lim = d.limit && d.limit.active ? d.limit : null;
    const lb = $('#cvLimit');
    if (lim && lb) {
      lb.hidden = false;
      const mine = s0.account && s0.account !== '自社' ? s0.account : 'default';
      const others = accounts.filter(a => a.ai === 'Claude' && a.config_dir && !(a.limit && a.limit.active) && a.profile !== mine);
      const html = `<b>${T('上限に当たっています')}</b> · ${esc(limitWhen(lim))}${(!(s0.ai || '').startsWith('Codex') && APP && others.length) ? `<div class="opts">${others.map(o => `<button data-prof="${esc(o.profile)}" data-dir="${esc(o.config_dir)}">${T('別アカウントで続ける')}: ${esc(DEMO ? o.profile : (o.email || o.profile))}</button>`).join('')}</div>` : ''}`;
      if (lb.dataset.html !== html) { lb.innerHTML = html; lb.dataset.html = html;
        lb.querySelectorAll('button[data-dir]').forEach(b => b.onclick = () => {
          if (!confirm(T('この会話の記録を別アカウントにコピーし、そのアカウントで続きを開きます。元のセッションはそのまま残ります。'))) return;
          toApp({type: 'switchAccount', tab: s0.tab, sid: s0.sid, cwd: s0.cwd, transcript: s0.transcript, configDir: b.dataset.dir, profile: b.dataset.prof});
        }); }
    } else if (lb) lb.hidden = true;
    const need = d.state === '確認待ち';
    $('#cvState').innerHTML = `<span class="dot ${need ? 'turn' : (d.mark === '🟢' || d.mark === '🟩') ? 'work' : 'wait'}"></span>${esc(TS(d.state))}`;
    const ask = $('#cvAsk');
    if (need) {
      ask.hidden = false;
      ask.innerHTML = `<div class="q">${esc(DEMO ? 'Allow Bash: npm test?' : (d.doing || T('判断を待っています')))}</div><div class="opts">
        <button data-k="1" class="primary">1 ${T('はい')}</button><button data-k="2">2 ${T('はい、今後も')}</button><button data-k="esc">Esc ${T('いいえ')}</button></div>`;
      ask.querySelectorAll('button').forEach(b => b.onclick = async () => { const r = await sendTo(d, b.dataset.k === 'esc' ? {key: 'esc'} : {text: b.dataset.k, enter: false}); say(r.ok ? T('送った') : r.reason, !r.ok); setTimeout(pull, 400); });
    } else if (d.state === '確認画面で停止') {
      // 新しいフォルダで開いた claude は、最初に「このフォルダを信頼しますか」で止まる。ここから答えられるようにする
      ask.hidden = false;
      ask.innerHTML = `<div class="q">${T('このフォルダを信頼しますか（claude の最初の確認）')}${isAppTab(d.tab) ? '' : ' — ' + T('端末で ↓ と Enter')}</div>` +
        (isAppTab(d.tab) ? `<div class="opts"><button data-t="yes" class="primary">${T('はい、信頼する')}</button><button data-t="no">${T('いいえ（終了）')}</button></div>` : '');
      ask.querySelectorAll('button').forEach(b => b.onclick = async () => {
        if (b.dataset.t === 'yes') { await sendTo(d, {key: 'down'}); await new Promise(r => setTimeout(r, 120)); }
        const r = await sendTo(d, {key: 'enter'});
        say(r.ok ? T('送った') : r.reason, !r.ok); setTimeout(pull, 800);
      });
    } else ask.hidden = true;
    if (d.same) return;
    etag = d.etag;
    log.innerHTML = DEMO ? convHtml((d.timeline || []).map((e, i) => Object.assign({}, e, {text: e.kind === '操作' ? pick(DEMO_DOING, 'op' + i) : pick(DEMO_TASKS, 'cv' + i)}))) : convHtml(d.timeline || []);
    if (stickBottom) log.scrollTop = log.scrollHeight;
  };
  pull(); clearInterval(detailTimer); detailTimer = setInterval(pull, 1500);
  const inp = $('#sendIn');
  if (inp) {
    inp.focus();
    let composedAt = 0;   // WebKit(Safari/アプリ)は確定の Enter を compositionend の後・isComposing=false・keyCode 229 で送ってくる
    inp.addEventListener('compositionend', () => { composedAt = performance.now(); });
    inp.addEventListener('keydown', async ev => {
      if (ev.key !== 'Enter' || ev.isComposing || ev.keyCode === 229 || performance.now() - composedAt < 80) return;   // 日本語変換の確定 Enter では送らない
      ev.preventDefault(); const v = inp.value; if (!v.trim()) return; inp.value = '';
      const r = await sendTo(s0, {text: v, enter: true}); say(r.ok ? T('送った') + ' ' + new Date().toLocaleTimeString() : r.reason, !r.ok);
      stickBottom = true; setTimeout(pull, 500);
    });
  }
}
async function renderPast(n) {

    <div class="kv" style="margin-top:8px"><div>AI</div><div>${esc(r.ai)}${r.account ? ' / ' + esc(r.account) : ''} ${esc(r.entrypoint || '')}</div><div>${T('フォルダ')}</div><div>${esc(demoCwd(r.cwd, r.id))}</div><div>${T('期間')}</div><div>${fmtT(r.start)} 〜 ${fmtT(r.end)}</div><div>${T('発言/操作')}</div><div>${T('人')} ${r.prompts} · AI ${r.responses} · ${T('ツール')} ${r.tools}</div><div>${T('編集したファイル')}</div><div>${(r.files_top || []).map(f => esc(f[0].split('/').pop()) + '×' + f[1]).join(', ') || '-'}</div>${r.children?.length ? `<div>${T('サブエージェント')}</div><div>${r.children.length}${T('件')} ${esc(Object.entries(r.child_models || {}).map(([k, v]) => k + '×' + v).join(' '))}</div>` : ''}<div>id</div><div style="font-size:10px">${esc(r.id)}</div></div>
    <div>${d.live_tab ? `<button class="primary" id="goBtn">${APP ? T('右の端末で開く') : `${T('iTerm でタブ')} ${esc(d.live_tab)}${T('を開く')}`}</button>` : (r.kind !== 'subagent' ? `<button class="primary" id="resumeBtn">${APP ? T('右の端末で再開') : T('iTerm で再開')} (${r.ai === 'Codex' ? 'codex resume' : 'claude --resume'})</button>` : '')}</div>
    ${(r.model_history || []).length > 1 ? `<h3>${T('使ったモデルの履歴')}</h3><div class="kv">${r.model_history.map(h => `<div>${esc(fmtT(h.t))}</div><div>${esc(h.model)}</div>`).join('')}</div>` : ''}
    <h3>${T('関係')}</h3><div id="rel"></div>
    <h3>${T('会話(依頼・返答・操作)')}</h3><div class="convlog past">${convHtml(DEMO ? d.timeline.map((e, i) => Object.assign({}, e, {text: pick(DEMO_TASKS, 'p' + i)})) : d.timeline)}</div>`;
  if ($('#goBtn')) $('#goBtn').onclick = async () => { const ls = (snap.sessions || []).find(x => x.tab === d.live_tab); if (APP && ls) { openInApp(ls); return; } const rr = await goTab(d.live_tab); if (!rr.ok) say(rr.reason, true); };
  if ($('#resumeBtn') && APP) $('#resumeBtn').onclick = () => toApp({type: 'resume', ai: r.ai, id: r.id, cwd: r.cwd});
  else if ($('#resumeBtn')) $('#resumeBtn').onclick = async () => { if (!confirm(`${T('新しい iTerm タブで再開します:')}\n${r.cwd}\n${r.ai === 'Codex' ? 'codex resume' : 'claude --resume'} ${r.id}`)) return; const rr = await getJSON('/api/resume', {method: 'POST', body: JSON.stringify({id: r.id})}); say(rr.ok ? T('送った') + ': ' + rr.cmd : rr.reason, !rr.ok); };
  relatedHtml(r.id, d.edges);
}
function relatedHtml(id, edges) {
  edges = edges || (index.edges || []).filter(e => e.from === id || e.to === id);
  const el = $('#rel'); if (!el) return;
  if (!edges.length) { el.innerHTML = `<span class="legend">${T('根拠のある関係は見つかっていない')}</span>`; return; }
  el.innerHTML = `<ul class="tl">${edges.map(e => { const other = e.from === id ? e.to : e.from; const ev = DEMO ? 'evidence hidden in demo' : typeof e.evidence === 'string' ? e.evidence : (e.evidence.matched_lines ? T('一致行: ') + e.evidence.matched_lines.join(' / ') : JSON.stringify(e.evidence)); return `<li><span class="k">${esc(e.label)}</span> <a href="#" data-sel="${esc(other)}">${esc(other.slice(0, 20))}…</a><div class="legend">${esc(ev)}</div></li>`; }).join('')}</ul>`;
  el.querySelectorAll('a[data-sel]').forEach(a => a.onclick = ev => { ev.preventDefault(); select(a.dataset.sel); });
}

// ---------------- 起動 ----------------
function fitLive() { const ns = (window._vis || []).filter(n => n.live && (n.state === '確認待ち' || n.mark === '🟢' || n.mark === '🟩')); if (ns.length) fitTo(ns); else fitAll(); }
loadSnap().then(() => { fitLive(); loadIndex(); });
setInterval(loadSnap, 3000);
setInterval(loadIndex, 300000);
// 自動操作(デモ録画・試験)用の口
try { new ResizeObserver(() => document.documentElement.style.setProperty('--tbh', $('#toolbar').offsetHeight + 'px')).observe($('#toolbar')); } catch (e) {}
window.board = {openInApp, renderProject, openDelegate, setToApp: f => { toAppImpl = f; }, fitTo, fitAll, select, closePanel, zoomBy,
  frames: () => window._frames, vis: () => window._vis, snap: () => snap,
  toolbar: () => renderToolbar(window._frames || [], window._vis || []), index: () => index, delegResult};   // 試験用: いまの snap で上のバーだけ描き直す
